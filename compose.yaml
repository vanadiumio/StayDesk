# Local dev infrastructure only. The app itself runs on the host (mvnw / IDE).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: staydesk
      POSTGRES_USER: staydesk
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - staydesk-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staydesk -d staydesk"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  staydesk-pgdata:
