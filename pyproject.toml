[project]
name = "staydesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddharth Mishra", email = "vanadium.io.509@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
staydesk = "staydesk:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pyright]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
exclude = [".venv", "alembic"]