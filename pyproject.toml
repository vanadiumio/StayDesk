[project]
name = "staydesk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siddharth Mishra", email = "vanadium.io.509@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pytest-asyncio>=1.5.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
staydesk = "staydesk:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
]
